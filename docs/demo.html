<style>
/* Layout: app shell — sticky top bar with portal tabs, one working column (max 980px); cards by role only */

}

  --ok: #6FCB93; --ok-soft: #1C3226; --warn: #F0B04C; --warn-soft: #3A2C14; --crit: #FF6B82; --crit-soft: #42202A; color-scheme: dark } }

  --ok: #6FCB93; --ok-soft: #1C3226; --warn: #F0B04C; --warn-soft: #3A2C14; --crit: #FF6B82; --crit-soft: #42202A; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }

.num { font-family: var(--f-data); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: grid; gap: 8px; padding-block: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.drop { width: 14px; height: 18px; background: var(--accent); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; transform: rotate(0deg); display: inline-block; }
.demo-tag { font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-soft); padding: 2px 10px; border-radius: 999px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tab { font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 18px 60px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.btn { font: inherit; font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent); cursor: pointer; }
.btn.ghost { background: var(--accent-soft); color: var(--accent); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13.5px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.pill.stable, .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.info { background: var(--accent-soft); color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .pill.critical.blink { animation: pulse 1s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .4; } }
.list { display: grid; gap: 8px; }
.item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; background: var(--bg); }
.item.crit { border-color: var(--crit); }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--mute); }
input[type=number], select { font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.switch { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }

.matrix { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.cell { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 3px; background: var(--bg); }
.cell.critical { border: 2px solid var(--crit); } .cell.warning { border: 2px solid var(--warn); }
.cell .days { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.cell .meta { font-size: 12px; color: var(--mute); }
.cell .acts { display: flex; gap: 6px; margin-top: 4px; }
.cell .acts button { flex: 1; }
.chart { overflow-x: auto; direction: ltr; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--mute); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-inline-end: 6px; border-radius: 2px; }
.plan .item h3 { font-size: 15px; }

/* chat */
.chat { display: grid; grid-template-rows: 1fr auto; min-height: 420px; max-height: 70vh; padding: 0; overflow: hidden; }
.msgs { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 85%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); }
.msg.tool { align-self: flex-start; font-size: 12.5px; color: var(--mute); background: transparent; padding: 0 4px; }
.composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: var(--surface); }
.composer input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; direction: rtl; }
.mapbox { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
.mapbox svg { display: block; width: 100%; height: auto; }
.gm { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 5px 10px; border-radius: 8px; background: var(--accent-soft); }
.gm:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.acts-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note { font-size: 12.5px; color: var(--mute); border-inline-start: 2px solid var(--line); padding-inline-start: 8px; }
</style>

<div class="app">
<header class="bar"><div class="wrap">
  <div class="brand">
    <h1><span class="drop" aria-hidden="true"></span>بنك الدم الذكي</h1>
    <span class="demo-tag">نسخة تجريبية · بيانات وهمية</span>
  </div>
  <div class="tabs" role="tablist" aria-label="البوابات">
    <button class="tab" role="tab" data-view="donor">بوابة المتبرع</button>
    <button class="tab" role="tab" data-view="beneficiary">بوابة المستفيد</button>
    <button class="tab" role="tab" data-view="facility">بوابة المنشأة</button>
    <button class="tab" role="tab" data-view="map">🗺️ الخريطة</button>
    <button class="tab" role="tab" data-view="forecast">📈 تنبؤ المخزون</button>
    <button class="tab" role="tab" data-view="agent">🤖 المساعد رفيق</button>
  </div>
</div></header>
<main class="wrap" id="view" aria-live="polite"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
// ============ بيانات تجريبية (وهمية) ============
const ME = { lat: 30.0444, lng: 31.2357 }; // وسط القاهرة (موقع افتراضي للتجربة)
const TYPES = ["O-","O+","A-","A+","B-","B+","AB-","AB+"];
const COMPAT = { "O-":["O-"], "O+":["O+","O-"], "A-":["A-","O-"], "A+":["A+","A-","O+","O-"], "B-":["B-","O-"], "B+":["B+","B-","O+","O-"], "AB-":["AB-","A-","B-","O-"], "AB+":TYPES.slice() };
const FAC = [
  { id: "f1", name: "مستشفى النيل التجريبي", kind: "مستشفى", lat: 30.0480, lng: 31.2290, phone: "0100 000 0001" },
  { id: "f2", name: "بنك دم الزمالك التجريبي", kind: "بنك دم", lat: 30.0626, lng: 31.2197, phone: "0100 000 0002" },
  { id: "f3", name: "مركز المعادي الطبي (تجريبي)", kind: "مركز طبي", lat: 29.9602, lng: 31.2569, phone: "0100 000 0003" },
  { id: "f4", name: "مستشفى الجيزة التجريبي", kind: "مستشفى", lat: 30.0131, lng: 31.2089, phone: "0100 000 0004" },
];
// مخزون كل منشأة + معدلات الصرف/الإيداع اليومية (للمنشأة f1 = منشأتك في بوابة المنشأة)
const STOCK = {
  f1: { "O-":[12,10,4,1], "O+":[30,15,6,7], "A-":[9,6,1.2,0.6], "A+":[40,15,5,4], "B-":[6,5,1,0.2], "B+":[22,10,3,2.6], "AB-":[4,3,0.3,0.2], "AB+":[11,5,1,1] },
  f2: { "O-":[25], "O+":[60], "A-":[8], "A+":[45], "B-":[3], "B+":[30], "AB-":[2], "AB+":[9] },
  f3: { "O-":[0], "O+":[14], "A-":[2], "A+":[18], "B-":[0], "B+":[7], "AB-":[0], "AB+":[4] },
  f4: { "O-":[5], "O+":[20], "A-":[3], "A+":[16], "B-":[1], "B+":[12], "AB-":[1], "AB+":[6] },
};
const INV = {}; for (const f in STOCK) { INV[f] = {}; for (const t of TYPES) INV[f][t] = STOCK[f][t][0]; }
const RATES = {}; for (const t of TYPES) RATES[t] = { safety: STOCK.f1[t][1], burn: STOCK.f1[t][2], inflow: STOCK.f1[t][3] };
// متبرعون وهميون (أعداد فقط تُعرض للمنشأة)
const DONORS = []; (function seed(){ let s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const dist = ["O+","O+","O+","A+","A+","B+","B+","O-","A-","AB+","B-","AB-"];
  for (let i = 0; i < 180; i++) DONORS.push({ bt: dist[Math.floor(r()*dist.length)], lat: 30.0444 + (r()-.5)*0.25, lng: 31.2357 + (r()-.5)*0.25, eligible: r() > .3 }); })();
const DONOR = { name: "أحمد (متبرع تجريبي)", bt: "O-", sex: "male", last: "2026-07-10", available: true };
let REQUESTS = [
  { id: "r1", fac: "f1", bt: "O-", units: 3, secured: 1, urgency: "critical", verified: true, mine: false },
  { id: "r2", fac: "f4", bt: "A-", units: 2, secured: 0, urgency: "urgent", verified: true, mine: false },
  { id: "r3", fac: "f3", bt: "B+", units: 1, secured: 0, urgency: "routine", verified: true, mine: false },
];
const RESPONSES = new Set();
const HOURS = { f1: "يوميًا 9 ص – 9 م", f2: "24 ساعة", f3: "السبت–الخميس 10 ص – 6 م", f4: "يوميًا 8 ص – 8 م" };
let APPT = null; // موعد التبرع المحجوز
const gmDir = (p) => `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=driving`;
const gmLink = (p, label = "📍 الاتجاهات في خرائط جوجل") => `<a class="gm" href="${gmDir(p)}" target="_blank" rel="noopener">${label}</a>`;
function sites() { return FAC.map((f) => ({ ...f, km: km(ME, f), hours: HOURS[f.id] })).sort((a, b) => a.km - b.km); }
function density() { const cells = new Map(); for (const d of DONORS) { if (!d.eligible || km(d, fac("f1")) > 20) continue; const k = (Math.round(d.lat*100)/100) + "," + (Math.round(d.lng*100)/100); cells.set(k, (cells.get(k) || 0) + 1); }
  return [...cells].filter(([, n]) => n >= 3).map(([k, n]) => { const [lat, lng] = k.split(",").map(Number); return { lat, lng, n }; }); }
let seq = 4;

// ============ أدوات ============
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const km = (a, b) => { const R = 6371, d2r = Math.PI/180; const dLat = (b.lat-a.lat)*d2r, dLng = (b.lng-a.lng)*d2r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*d2r)*Math.cos(b.lat*d2r)*Math.sin(dLng/2)**2; return Math.round(2*R*Math.asin(Math.sqrt(x))*10)/10; };
const fac = (id) => FAC.find((f) => f.id === id);
const URG = { routine: "عادي", urgent: "عاجل", critical: "حرج 🚨" };
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3200); }
function nextEligible() { const gap = DONOR.sex === "female" ? 112 : 84; const d = new Date(new Date(DONOR.last).getTime() + gap*864e5); return d > new Date() ? d : null; }
function inventoryNear(bt, radius = 30) {
  const out = [];
  for (const f of FAC) for (const t of COMPAT[bt]) if (INV[f.id][t] > 0) { const d = km(ME, f); if (d <= radius) out.push({ fid: f.id, name: f.name, kind: f.kind, phone: f.phone, bt: t, units: INV[f.id][t], km: d, exact: t === bt }); }
  return out.sort((a, b) => (b.exact - a.exact) || a.km - b.km);
}
function donorsFor(req, radius = 15) { const f = fac(req.fac); return DONORS.filter((d) => d.eligible && COMPAT[req.bt].includes(d.bt) && km(d, f) <= radius); }
function openForDonor() { return REQUESTS.filter((r) => r.verified && r.secured < r.units && COMPAT[r.bt].includes(DONOR.bt)).map((r) => ({ ...r, km: km(ME, fac(r.fac)) })).sort((a, b) => ({critical:0,urgent:1,routine:2}[a.urgency] - {critical:0,urgent:1,routine:2}[b.urgency]) || a.km - b.km); }

// ============ محرك التنبؤ (نفس منطق التطبيق) ============
const SEASONS = { none:["عادي",1,1], ramadan:["🌙 رمضان",0.92,0.62], hajj:["🕋 الحج والعمرة",1.2,0.9,{"O-":1.35,"A-":1.25,"B-":1.25,"AB-":1.2}], summer:["☀️ الصيف",1,0.7], flu:["❄️ الإنفلونزا",1,0.8], holidays:["🎉 الأعياد",1.25,0.75,{"O-":1.2,"O+":1.15}] };
const SURGES = { moderate:["معتدل",1], high:["مرتفع +25%",1.25], code_red:["كود أحمر +60%",1.6] };
const RISK = { critical: "🚨 خطر حاد", warning: "⚠️ إنذار مبكر", stable: "🟢 مستقر" };
const FC = { season: "none", surge: "moderate", horizon: 14 };
const r1 = (n) => Math.round(n*10)/10;
function forecast() {
  const [, sb, si, tb] = SEASONS[FC.season], sf = SURGES[FC.surge][1];
  return TYPES.map((t) => { const u = INV.f1[t], R = RATES[t];
    const burn = R.burn*sb*((tb && tb[t]) || 1)*sf, inflow = R.inflow*si, net = inflow - burn;
    const days = net >= 0 ? null : u / -net;
    let risk = days !== null && days < 4 ? "critical" : days !== null && days <= 8 ? "warning" : u < R.safety ? "warning" : "stable";
    if (u === 0 && burn > 0) risk = "critical";
    const date = days === null ? null : new Date(Date.now() + Math.floor(days)*864e5).toISOString().slice(0,10);
    return { t, u, safety: R.safety, burn: r1(burn), inflow: r1(inflow), net, days: days === null ? null : r1(days), date, risk, need: Math.max(0, Math.ceil(R.safety - (u + net*FC.horizon))) };
  }).sort((a, b) => ({critical:0,warning:1,stable:2}[a.risk] - {critical:0,warning:1,stable:2}[b.risk]) || (a.days ?? 1e9) - (b.days ?? 1e9));
}
function rulePlan(f) {
  const crit = f.filter((x) => x.risk === "critical"), warn = f.filter((x) => x.risk === "warning"), out = [];
  if (crit.length) {
    out.push({ p: "فورًا", title: "نداء فوري للمتبرعين", detail: `استدعِ متبرعين مؤهلين من فصائل ${crit.map((x) => x.t).join("، ")} — المطلوب تقريبًا: ${crit.map((x) => `${x.t}: ${x.need} وحدة`).join("، ")}.` });
    out.push({ p: "فورًا", title: "تفعيل الاستعارة بين المستشفيات", detail: "اطلب تحويل وحدات من منشآت قريبة لديها فائض أو وحدات قريبة الانتهاء، مع التزام سلسلة التبريد." });
    out.push({ p: "خلال 24 ساعة", title: "ترشيد الاستهلاك", detail: "راجع جدول العمليات الاختيارية مع لجنة نقل الدم، وطبّق إدارة دم المريض (PBM)." });
  }
  if (warn.length) out.push({ p: "هذا الأسبوع", title: "جدولة حملة تبرع متنقلة", detail: `نظّم حملة ${FC.season === "ramadan" ? "مسائية بعد الإفطار" : "في جامعة أو شركة قريبة"} تستهدف ${warn.map((x) => x.t).join("، ")} قبل دخولها مرحلة الخطر.` });
  if (!out.length) out.push({ p: "هذا الأسبوع", title: "الرصيد مستقر", detail: "استمر في المتابعة اليومية وحافظ على الحد الآمن." });
  return out;
}
let aiPlan = null, aiPlanKey = "";

// ============ الذكاء الاصطناعي (عبر حساب Claude الخاص بالمشاهد) ============
let samplePromise = null;
const getSample = () => (samplePromise ||= (window.claude?.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null)));
const SAMPLE_ERR = { not_granted: "لم يتم السماح للصفحة باستخدام Claude، فالمساعد متوقف في هذه الجلسة.", rate_limited: "طلبات كثيرة، انتظر قليلًا ثم حاول.", cancelled: "تم الإيقاف." };

// ============ العرض ============
let view = "donor";
function setView(v) { view = v; document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === v))); render(); window.scrollTo(0, 0); }
document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));

function render() {
  const el = $("#view");
  if (view === "donor") el.innerHTML = donorView();
  else if (view === "beneficiary") el.innerHTML = benView();
  else if (view === "facility") el.innerHTML = facView();
  else if (view === "forecast") el.innerHTML = fcView();

}

function drawMap() {
  const css = getComputedStyle(document.documentElement), c = (n) => css.getPropertyValue(n).trim();
  const W = 640, H = 380, box = { minLat: 29.93, maxLat: 30.12, minLng: 31.13, maxLng: 31.36 };
  const X = (lng) => ((lng - box.minLng) / (box.maxLng - box.minLng)) * W, Y = (lat) => H - ((lat - box.minLat) / (box.maxLat - box.minLat)) * H;
  let g = `<rect width="${W}" height="${H}" fill="${c("--bg")}"/>`;
  for (let i = 1; i < 8; i++) g += `<line x1="${i*W/8}" y1="0" x2="${i*W/8}" y2="${H}" stroke="${c("--line")}"/><line x1="0" y1="${i*H/8}" x2="${W}" y2="${i*H/8}" stroke="${c("--line")}"/>`;
  // النيل (مسار تقريبي للتوضيح)
  const nile = [[29.93,31.245],[29.97,31.235],[30.01,31.228],[30.04,31.226],[30.065,31.222],[30.09,31.228],[30.12,31.235]];
  g += `<path d="${nile.map(([la, ln], i) => `${i ? "L" : "M"}${X(ln).toFixed(1)},${Y(la).toFixed(1)}`).join(" ")}" stroke="#4A90C8" stroke-opacity=".55" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  g += `<text x="${X(31.222)+10}" y="${Y(30.105)}" font-size="12" fill="#4A90C8">النيل</text>`;
  if (mapRole === "facility") {
    const cells = density(), mx = Math.max(1, ...cells.map((x) => x.n));
    for (const cl of cells) g += `<circle cx="${X(cl.lng)}" cy="${Y(cl.lat)}" r="${10 + 16*cl.n/mx}" fill="${c("--accent")}" fill-opacity="${.15 + .45*cl.n/mx}"/><text x="${X(cl.lng)}" y="${Y(cl.lat)+4}" font-size="11" text-anchor="middle" fill="${c("--ink")}" font-family="IBM Plex Mono, monospace">${cl.n}</text>`;
    const f = fac("f1"); g += `<circle cx="${X(f.lng)}" cy="${Y(f.lat)}" r="9" fill="${c("--ink")}" stroke="${c("--surface")}" stroke-width="3"/><text x="${X(f.lng)}" y="${Y(f.lat)-14}" font-size="12" text-anchor="middle" fill="${c("--ink")}" font-weight="700">${esc(f.name)}</text>`;
  } else {
    const urgent = mapRole === "donor" ? new Set(openForDonor().map((r) => r.fac)) : new Set();
    const shown = mapRole === "beneficiary" ? new Set(inventoryNear(benBt || "O-", 50).map((x) => x.fid)) : new Set(FAC.map((f) => f.id));
    for (const f of FAC) { if (!shown.has(f.id)) continue; const col = urgent.has(f.id) ? c("--crit") : "#1565C0";
      g += `<a href="${gmDir(f)}" target="_blank" rel="noopener"><path d="M${X(f.lng)},${Y(f.lat)} c-9,-14 -12,-20 -12,-26 a12,12 0 1 1 24,0 c0,6 -3,12 -12,26z" fill="${col}"/><circle cx="${X(f.lng)}" cy="${Y(f.lat)-26}" r="4.5" fill="#fff"/>
      <text x="${X(f.lng)}" y="${Y(f.lat)+16}" font-size="12" text-anchor="middle" fill="${c("--ink")}" font-weight="600" paint-order="stroke" stroke="${c("--bg")}" stroke-width="4">${esc(f.name)}</text></a>`; }
    g += `<circle cx="${X(ME.lng)}" cy="${Y(ME.lat)}" r="8" fill="#1A73E8" stroke="#fff" stroke-width="3"/><text x="${X(ME.lng)}" y="${Y(ME.lat)+26}" font-size="12" text-anchor="middle" fill="#1A73E8" font-weight="700" paint-order="stroke" stroke="${c("--bg")}" stroke-width="4">أنت</text>`;
  }
  $("#mapbox").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="خريطة توضيحية للأماكن القريبة">${g}</svg>`;
}

const planKey = () => `${FC.season}|${FC.surge}|${FC.horizon}|${TYPES.map((t) => INV.f1[t]).join(",")}`;

function drawChart() {
  const css = getComputedStyle(document.documentElement), col = [css.getPropertyValue("--crit").trim(), css.getPropertyValue("--plasma").trim()];
  const mute = css.getPropertyValue("--mute").trim(), line = css.getPropertyValue("--line").trim();
  const series = forecast().slice(0, 2), D = 14, W = 640, H = 220, L = 34, R = 14, T = 14, B = 26;
  const pts = series.map((x) => Array.from({ length: D+1 }, (_, d) => Math.max(0, x.u + x.net*d)));
  const step = Math.max(1, Math.ceil(Math.max(1, ...pts.flat(), ...series.map((x) => x.safety))*1.1/4)), maxY = step*4;
  const X = (d) => L + (d/D)*(W-L-R), Y = (v) => T + (1 - v/maxY)*(H-T-B);
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = step*k; g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${line}"/><text x="${L-6}" y="${Y(v)+4}" font-size="10" fill="${mute}" text-anchor="end" font-family="IBM Plex Mono, monospace">${v}</text>`; }
  [0, 7, 14].forEach((d) => g += `<text x="${X(d)}" y="${H-8}" font-size="10" fill="${mute}" text-anchor="middle">${d === 0 ? "اليوم" : "+" + d}</text>`);
  series.forEach((x, i) => { const p = pts[i].map((v, d) => `${d ? "L" : "M"}${X(d).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    g += `<path d="${p} L${X(D)},${Y(0)} L${X(0)},${Y(0)} Z" fill="${col[i]}" fill-opacity="0.12"/><path d="${p}" fill="none" stroke="${col[i]}" stroke-width="2.5"/>`;
    g += `<line x1="${L}" x2="${W-R}" y1="${Y(x.safety)}" y2="${Y(x.safety)}" stroke="${col[i]}" stroke-dasharray="5 4" stroke-opacity="0.7"/><circle cx="${X(D)}" cy="${Y(pts[i][D])}" r="3.5" fill="${col[i]}"/>`; });
  $("#chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;max-width:${W}px" role="img" aria-label="منحنى الرصيد المتوقع">${g}</svg>`;
  $("#legend").innerHTML = series.map((x, i) => `<span><i style="background:${col[i]}"></i><bdi dir="ltr">${x.t}</bdi> (المتقطع = الحد الآمن)</span>`).join("");
}

    <div class="row"><h2>المساعد الذكي رفيق</h2>
      <div class="chips" aria-label="أتحدث بصفتي">${[["beneficiary","مستفيد"],["donor","متبرع"],["facility","موظف منشأة"]].map(([k, l]) => `<button class="chip" data-arole="${k}" aria-pressed="${agentRole === k}">${l}</button>`).join("")}</div></div>
    <p class="small mute" id="agentnote">يعمل على بيانات هذه التجربة: يبحث في المخزون، ويتحقق من الأهلية، وينشئ الطلبات بعد تأكيدك.</p>
    <div class="suggest">${["أحتاج دم O- لوالدي قرب وسط القاهرة","هل أستطيع التبرع الآن؟","ما الفصائل المتوافقة مع A+؟","ما الفصائل المعرضة للنفاد في مستشفانا؟"].map((q) => `<button class="chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
  </div>
  <div class="card chat"><div class="msgs" id="msgs"></div>
    <form class="composer" id="composer"><input id="q" autocomplete="off" placeholder="اكتب سؤالك…" aria-label="سؤالك"><button class="btn" id="send">إرسال</button><button class="btn ghost" type="button" id="stop" hidden>إيقاف</button></form>
  </div>`;
}
function paintChat() { const m = $("#msgs"); if (!m) return; m.innerHTML = BUBBLES.map((b) => `<div class="msg ${b.k === "me" ? "me" : b.k === "tool" ? "tool" : "bot"}">${esc(b.t)}</div>`).join(""); m.scrollTop = m.scrollHeight; }
async function setupAgent() {
  const s = await getSample();
  if (!s && view === "agent") { $("#agentnote").textContent = "المساعد الذكي يعمل عند فتح هذه الصفحة داخل Claude. باقي التجربة يعمل بالكامل."; $("#send").disabled = true; }
}
const TOOLS = () => [
  { name: "blood_compatibility", description: "Returns donor blood types compatible with a recipient type (red cells).", inputSchema: { type: "object", properties: { recipient: { type: "string", enum: TYPES } }, required: ["recipient"] },
    execute: ({ recipient }) => { note(`🔎 فحص التوافق لـ ${recipient}`); return { compatible: COMPAT[recipient] || [] }; } },
  { name: "search_inventory", description: "Search verified facilities near the user for compatible blood stock. Returns name, phone, type, units, distance km.", inputSchema: { type: "object", properties: { blood_type: { type: "string", enum: TYPES }, radius_km: { type: "number" } }, required: ["blood_type"] },
    execute: ({ blood_type, radius_km }) => { if (!COMPAT[blood_type]) throw new Error("unknown blood type"); note(`🔎 بحث في المخزون عن ${blood_type}`); return { results: inventoryNear(blood_type, Math.min(+radius_km || 30, 100)).slice(0, 6) }; } },
  { name: "my_eligibility", description: "Donation eligibility of the signed-in donor (interval rule).", execute: () => { note("🩺 فحص الأهلية"); const n = nextEligible(); return { blood_type: DONOR.bt, last_donation: DONOR.last, interval_days: 84, eligible_now: !n, next_eligible_date: n ? n.toISOString().slice(0,10) : "now", available: DONOR.available }; } },
  { name: "open_requests_near_me", description: "Open verified blood requests near the donor that their blood type can serve.", execute: () => { note("📋 الطلبات القريبة"); return { requests: openForDonor().map((r) => ({ facility: fac(r.fac).name, blood_type: r.bt, units_left: r.units - r.secured, urgency: r.urgency, km: r.km })) }; } },
  { name: "create_blood_request", description: "Create a blood request at a facility. Only call after the user explicitly confirmed the summarized details in their latest message.", inputSchema: { type: "object", properties: { facility_id: { type: "string", enum: FAC.map((f) => f.id) }, blood_type: { type: "string", enum: TYPES }, units: { type: "integer" }, urgency: { type: "string", enum: ["routine","urgent","critical"] }, user_confirmed: { type: "boolean" } }, required: ["facility_id","blood_type","units","urgency","user_confirmed"] },
    execute: (i) => { if (i.user_confirmed !== true) return { error: "need explicit user confirmation first" }; const u = Math.round(+i.units); if (!fac(i.facility_id) || !COMPAT[i.blood_type] || !(u >= 1 && u <= 20)) throw new Error("invalid request");
      const r = { id: "r" + seq++, fac: i.facility_id, bt: i.blood_type, units: u, secured: 0, urgency: ["routine","urgent","critical"].includes(i.urgency) ? i.urgency : "urgent", verified: false, mine: true };
      REQUESTS.push(r); note(`✅ تم إنشاء طلب ${r.bt} لدى ${fac(r.fac).name}`); return { created: { facility: fac(r.fac).name, blood_type: r.bt, units: u, status: "awaiting facility verification" } }; } },
  { name: "facility_forecast", description: "For facility staff: shortage forecast for the user's hospital (days until depletion and risk per blood type) under current season/surge settings.", execute: () => { note("📈 قراءة التنبؤ"); return { facility: fac("f1").name, season: FC.season, surge: FC.surge, forecast: forecast().map(({ t, u, safety, burn, inflow, days, date, risk, need }) => ({ blood_type: t, units: u, safety, burn_per_day: burn, inflow_per_day: inflow, days_until_depletion: days, depletion_date: date, risk, units_needed: need })) }; } },
];
function note(t) { BUBBLES.push({ k: "tool", t }); paintChat(); }
const ROLE_TXT = { beneficiary: "a patient relative / beneficiary looking for blood", donor: "a blood donor (type O-)", facility: "staff at " + "the user's hospital (facility f1)" };
async function ask(q) {
  q = q.trim(); if (!q || agentBusy) return;
  const s = await getSample(); if (!s) return;
  BUBBLES.push({ k: "me", t: q }); CHAT.push({ role: "user", content: q });
  const bot = { k: "bot", t: "يفكر…" }; BUBBLES.push(bot); paintChat();
  agentBusy = true; agentCtl = new AbortController(); toggleBusy(true);
  const head = `You are "رفيق" (Rafeeq), the assistant of a SMART BLOOD BANK demo app in Egypt. Reply in Arabic (Egyptian-friendly MSA), short and warm. The user is ${ROLE_TXT[agentRole]}; their location is downtown Cairo.
Rules: use the tools for every fact about stock, requests or eligibility — never invent numbers. No medical diagnosis; refer detailed medical eligibility to the blood bank doctor. In emergencies (bleeding, accident) first advise calling an ambulance (123 in Egypt). Never reveal donor identities. Blood donation is voluntary and unpaid — never suggest buying/selling blood. Before create_blood_request, summarize facility, type, units and urgency and ask the user to confirm; call it only after they confirm. Facility ids: ${FAC.map((f) => `${f.id}=${f.name}`).join(", ")}. All data is demo data.`;
  const input = CHAT.map((m, i) => i === 0 ? { role: "user", content: head + "\n\nUser: " + m.content } : m);
  try {
    const { text } = await s(input, { tools: TOOLS(), modelTier: "quick", cache: false, signal: agentCtl.signal,
      onText: ({ text }) => { bot.t = text; BUBBLES.splice(BUBBLES.indexOf(bot), 1); BUBBLES.push(bot); paintChat(); } });
    bot.t = text || "…"; CHAT.push({ role: "assistant", content: bot.t });
  } catch (e) {
    bot.t = e?.text || SAMPLE_ERR[e?.code] || "تعذّر الرد الآن، حاول مرة أخرى.";
    if (e?.text) CHAT.push({ role: "assistant", content: e.text }); else CHAT.pop();
  } finally { agentBusy = false; toggleBusy(false); paintChat(); if (view !== "agent") toast("رد المساعد جاهز في تبويب المساعد"); }
}
function toggleBusy(b) { const send = $("#send"), stop = $("#stop"); if (send) send.disabled = b; if (stop) stop.hidden = !b; }

async function genPlan() {
  const s = await getSample(); if (!s) return;
  const st = $("#aiplanst"), btn = $("#aiplan"); btn.disabled = true; st.textContent = "يفكر…";
  const key = planKey();
  try {
    const data = await s.json(`You advise a hospital blood bank in Egypt. Given this deterministic shortage forecast (JSON), propose 3-5 prioritized operational interventions (donor recall, inter-hospital borrowing, Patient Blood Management, season-timed mobile drives, monitoring). Use only the given numbers. No patient-level clinical orders. Never suggest buying blood or paying donors.
Return ONLY JSON: {"items":[{"p":"فورًا|خلال 24 ساعة|هذا الأسبوع","title":"Arabic, short","detail":"Arabic, max 2 sentences"}]}
Season: ${SEASONS[FC.season][0]}; surge: ${SURGES[FC.surge][0]}; horizon: ${FC.horizon} days.
${JSON.stringify(forecast().map(({ t, u, safety, burn, inflow, days, risk, need }) => ({ t, u, safety, burn, inflow, days, risk, need })))}`, { modelTier: "quick" });
    if (!Array.isArray(data?.items) || !data.items.length) throw { code: "bad" };
    aiPlan = data.items.slice(0, 6).map((x) => ({ p: String(x.p || ""), title: String(x.title || ""), detail: String(x.detail || "") })); aiPlanKey = key;
    if (view === "forecast") render();
  } catch (e) { if (st) st.textContent = SAMPLE_ERR[e?.code] || "تعذّر توليد الخطة، الخطة الفورية معروضة."; if (btn) btn.disabled = false; }
}

// ============ ربط الأحداث ============
function bind() {
  document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => setView(b.dataset.go));
  const av = $("#avail"); if (av) av.onchange = () => { DONOR.available = av.checked; toast(av.checked ? "ستصلك نداءات الطوارئ" : "تم إيقاف النداءات مؤقتًا"); render(); };
  document.querySelectorAll("[data-respond]").forEach((b) => b.onclick = () => { const r = REQUESTS.find((x) => x.id === b.dataset.respond); RESPONSES.add(r.id); toast(`شكرًا لك ❤️ تم إبلاغ ${fac(r.fac).name}. توجّه إليه ومعك بطاقة الهوية.`); render(); });
  document.querySelectorAll("[data-bt]").forEach((b) => b.onclick = () => { benBt = b.dataset.bt; benResults = null; render(); });
  const un = $("#units"); if (un) un.onchange = () => benUnits = Math.max(1, Math.min(20, Math.round(+un.value) || 1));
  const se = $("#search"); if (se) se.onclick = () => { benResults = inventoryNear(benBt); render(); };
  document.querySelectorAll("[data-req]").forEach((b) => b.onclick = () => { const r = { id: "r" + seq++, fac: b.dataset.req, bt: benBt, units: benUnits, secured: 0, urgency: "urgent", verified: false, mine: true }; REQUESTS.push(r); toast(`تم إرسال الطلب إلى ${fac(r.fac).name}. سيتواصل معك للتأكيد.`); render(); });
  document.querySelectorAll("[data-mv]").forEach((b) => b.onclick = () => { const [t, d] = b.dataset.mv.split(":"); INV.f1[t] = Math.max(0, INV.f1[t] + +d); if (+d < 0) RATES[t].burn = r1(RATES[t].burn + 1/14); else RATES[t].inflow = r1(RATES[t].inflow + 1/14); render(); });
  document.querySelectorAll("[data-verify]").forEach((b) => b.onclick = () => { const r = REQUESTS.find((x) => x.id === b.dataset.verify); r.verified = true; toast(`تم التوثيق. يوجد ${donorsFor(r).length} متبرع مؤهل ضمن 15 كم وتم إشعارهم (محاكاة).`); render(); });
  document.querySelectorAll("[data-fulfil]").forEach((b) => b.onclick = () => { const r = REQUESTS.find((x) => x.id === b.dataset.fulfil); if (INV.f1[r.bt] > 0) { INV.f1[r.bt]--; r.secured++; RATES[r.bt].burn = r1(RATES[r.bt].burn + 1/14); toast(`تم صرف وحدة ${r.bt} للطلب.`); render(); } });
  document.querySelectorAll("[data-mrole]").forEach((b) => b.onclick = () => { mapRole = b.dataset.mrole; render(); });
  document.querySelectorAll("[data-book]").forEach((b) => b.onclick = () => { const f = fac(b.dataset.book); const d = new Date(Date.now() + 864e5);
    APPT = { fid: f.id, name: f.name, when: d.toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" }) + " الساعة 11:00" };
    toast(`تم الحجز ❤️ ${f.name} — ${APPT.when}. اشرب 500 مل ماء قبل الموعد.`); render(); });
  document.querySelectorAll("[data-season]").forEach((b) => b.onclick = () => { FC.season = b.dataset.season; render(); });
  document.querySelectorAll("[data-surge]").forEach((b) => b.onclick = () => { FC.surge = b.dataset.surge; render(); });
  const hz = $("#hz"); if (hz) { hz.oninput = () => { FC.horizon = +hz.value; $("#hzv").textContent = hz.value; }; hz.onchange = render; }
  const rc = $("#recall"); if (rc) rc.onclick = () => { const types = forecast().filter((x) => x.risk !== "stable").map((x) => x.t); const n = DONORS.filter((d) => d.eligible && types.includes(d.bt) && km(d, fac("f1")) <= 25).length; toast(`تم إرسال نداء إلى ${n} متبرع مؤهل من فصائل ${types.join(" ")} (محاكاة).`); };
  const ap = $("#aiplan"); if (ap) { getSample().then((s) => { if (s && $("#aiplan")) $("#aiplan").hidden = false; }); ap.onclick = genPlan; }
  document.querySelectorAll("[data-arole]").forEach((b) => b.onclick = () => { agentRole = b.dataset.arole; document.querySelectorAll("[data-arole]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); });
  document.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => ask(b.dataset.q));
  const cf = $("#composer"); if (cf) cf.onsubmit = (e) => { e.preventDefault(); const q = $("#q"); const v = q.value; q.value = ""; ask(v); };
  const sp = $("#stop"); if (sp) sp.onclick = () => agentCtl?.abort();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (view === "forecast") drawChart(); if (view === "map") drawMap(); });
new MutationObserver(() => { if (view === "forecast") drawChart(); if (view === "map") drawMap(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
setView("donor");
})();
</script>
