/* Layout: app shell — sticky bar (brand, language, portal tabs) over one working column (max 980px) */

  --ok: #6FCB93; --ok-soft: #1C3226; --warn: #F0B04C; --warn-soft: #3A2C14; --crit: #FF6B82; --crit-soft: #42202A; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
body.ur { font-family: "Noto Nastaliq Urdu", var(--f-body); line-height: 2.1; }

.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

h2 { font-size: 19px; font-weight: 600; } h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.mute { color: var(--mute); } .small { font-size: 13px; }
.num, .bt, .code { font-family: var(--f-data); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }

header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: grid; gap: 8px; padding-block: 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.drop { width: 14px; height: 18px; background: var(--accent); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; display: inline-block; }
.brand-r { display: flex; align-items: center; gap: 8px; }

.tabs, .subtabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }

.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

.btn:disabled { opacity: .45; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13.5px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }

.item.crit { border-color: var(--crit); } .item.warnb { border-color: var(--warn); }

.switch { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }
.matrix { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

.cell .meta { font-size: 12px; color: var(--mute); }
.cell .acts { display: flex; gap: 6px; margin-top: 4px; } .cell .acts button { flex: 1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

.subtabs { padding-bottom: 2px; } .subtabs .chip { white-space: nowrap; flex: none; }

.gm { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 5px 10px; border-radius: 8px; background: var(--accent-soft); }

.msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); }
.msg.tool { align-self: flex-start; font-size: 12.5px; color: var(--mute); background: transparent; padding: 0 4px; }
.composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: var(--surface); }

.report { white-space: pre-wrap; line-height: 1.9; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }
.note { font-size: 12.5px; color: var(--mute); border-inline-start: 2px solid var(--line); padding-inline-start: 8px; }
.audit { font-family: var(--f-data); font-size: 12px; direction: ltr; text-align: start; unicode-bidi: plaintext; color: var(--mute); }

function templateReport() { const fc = forecast(), tr = triage(); const L = (k) => t(k);
  return [`🔴 ${L("risk_critical")}: ${fc.filter((x) => x.risk === "critical").map((x) => `${x.b} (${x.days ?? "–"})`).join(", ") || L("none")}`,
    `🟠 ${L("risk_warning")}: ${fc.filter((x) => x.risk === "warning").map((x) => `${x.b} (${x.days ?? "–"})`).join(", ") || L("none")}`,
    `📋 ${f("incoming", { n: tr.length })}: ${tr.slice(0, 3).map((r) => `${r.bt}×${r.left} [${r.score}]`).join(", ") || L("none")}`,
    `⚠️ ${L("expiringSoon").replace("⚠️ ", "")}: O+×3, A+×2`].join("\n"); }

function mapView() { const roles = [["donor", t("roleDonor")], ["beneficiary", t("roleBeneficiary")], ["facility", t("tFacility")]]; let list = "", hint = "";
  if (mapRole === "donor") { const urgent = new Set(openForDonor().map((r) => r.fac)); hint = t("nearestSites");
    list = live().map((x) => ({ ...x, km: km(ME, x) })).sort((a, b) => a.km - b.km).map((x) => `<div class="item ${urgent.has(x.id) ? "crit" : ""}"><div class="row"><h3>${esc(fname(x))}</h3>${urgent.has(x.id) ? `<span class="pill critical">${esc(f("needsNow", { t: DONOR.bt, u: "" }).replace(/\s*\(\s*\S*\s*\)\s*$/, ""))}</span>` : `<span class="pill info">${esc(t("k_" + x.kind))}</span>`}</div>

  else if (mapRole === "beneficiary") { const bt = benBt || "O-"; hint = `${t("patientType")}: ${bt}`; const by = new Map(); for (const x of inventoryNear(bt, 50)) { const p = by.get(x.fid); by.set(x.fid, (p ? p + " · " : "") + `${x.b}: ${x.units}`); }
    list = [...by].map(([id, parts]) => `<div class="item"><div class="row"><h3>${esc(fname(fac(id)))}</h3><span class="small num">${km(ME, fac(id))} ${esc(t("km"))}</span></div><p class="small mute bt">${parts}</p><div class="acts-row">${gm(fac(id))}</div></div>`).join("") || `<p class="mute">${esc(t("noStock"))}</p>`; }
  else { const c = density(); hint = f("densityInfo", { n: c.reduce((a, x) => a + x.n, 0), c: c.length }); list = `<button class="btn" data-go="forecast">🚨 ${esc(t("recall"))}</button>`; }
  return `<div class="card"><div class="row"><h2>${esc(t("tMap"))}</h2><div class="chips">${roles.map(([k, l]) => `<button class="chip" data-mrole="${k}" aria-pressed="${mapRole === k}">${esc(l)}</button>`).join("")}</div></div>
    <div class="mapbox" id="mapbox"></div><p class="small mute">${esc(hint)}</p><p class="note">${esc(t("mapNote"))}</p></div><div class="list">${list}</div>`; }
function density() { const cells = new Map(); for (const d of DONORS) { if (!d.eligible || km(d, fac("f1")) > 20) continue; const k = (Math.round(d.lat*100)/100) + "," + (Math.round(d.lng*100)/100); cells.set(k, (cells.get(k) || 0) + 1); }
  return [...cells].filter(([, n]) => n >= 3).map(([k, n]) => { const [lat, lng] = k.split(",").map(Number); return { lat, lng, n }; }); }
function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawMap() { const W = 640, H = 380, bx = { a: 29.93, b: 30.12, c: 31.13, d: 31.36 }, X = (g) => ((g - bx.c) / (bx.d - bx.c)) * W, Y = (l) => H - ((l - bx.a) / (bx.b - bx.a)) * H;
  let g = `<rect width="${W}" height="${H}" fill="${css("--bg")}"/>`; for (let i = 1; i < 8; i++) g += `<line x1="${i*W/8}" y1="0" x2="${i*W/8}" y2="${H}" stroke="${css("--line")}"/><line x1="0" y1="${i*H/8}" x2="${W}" y2="${i*H/8}" stroke="${css("--line")}"/>`;
  const nile = [[29.93,31.245],[29.97,31.235],[30.01,31.228],[30.04,31.226],[30.065,31.222],[30.09,31.228],[30.12,31.235]];
  g += `<path d="${nile.map(([a, b], i) => `${i ? "L" : "M"}${X(b).toFixed(1)},${Y(a).toFixed(1)}`).join(" ")}" stroke="${css("--sea")}" stroke-opacity=".55" stroke-width="9" fill="none" stroke-linecap="round"/><text x="${X(31.222) + 10}" y="${Y(30.105)}" font-size="12" fill="${css("--sea")}">${esc(t("nile"))}</text>`;
  const lbl = (x, y, s, c) => `<text x="${x}" y="${y}" font-size="12" text-anchor="middle" fill="${c}" font-weight="600" paint-order="stroke" stroke="${css("--bg")}" stroke-width="4">${esc(s)}</text>`;
  if (mapRole === "facility") { const c = density(), mx = Math.max(1, ...c.map((x) => x.n)); for (const cl of c) g += `<circle cx="${X(cl.lng)}" cy="${Y(cl.lat)}" r="${10 + 16*cl.n/mx}" fill="${css("--accent")}" fill-opacity="${.15 + .45*cl.n/mx}"/><text x="${X(cl.lng)}" y="${Y(cl.lat)+4}" font-size="11" text-anchor="middle" fill="${css("--ink")}" font-family="IBM Plex Mono, monospace">${cl.n}</text>`;
    const x = fac("f1"); g += `<circle cx="${X(x.lng)}" cy="${Y(x.lat)}" r="9" fill="${css("--ink")}" stroke="${css("--surface")}" stroke-width="3"/>` + lbl(X(x.lng), Y(x.lat) - 14, fname(x), css("--ink")); }
  else { const urgent = mapRole === "donor" ? new Set(openForDonor().map((r) => r.fac)) : new Set(); const shown = mapRole === "beneficiary" ? new Set(inventoryNear(benBt || "O-", 50).map((x) => x.fid)) : new Set(live().map((x) => x.id));
    for (const x of live()) { if (!shown.has(x.id)) continue; const col = urgent.has(x.id) ? css("--crit") : css("--pin");
      g += `<a href="${gmDir(x)}" target="_blank" rel="noopener"><path d="M${X(x.lng)},${Y(x.lat)} c-9,-14 -12,-20 -12,-26 a12,12 0 1 1 24,0 c0,6 -3,12 -12,26z" fill="${col}"/><circle cx="${X(x.lng)}" cy="${Y(x.lat) - 26}" r="4.5" fill="#fff"/>${lbl(X(x.lng), Y(x.lat) + 16, fname(x), css("--ink"))}</a>`; }
    g += `<circle cx="${X(ME.lng)}" cy="${Y(ME.lat)}" r="8" fill="#1A73E8" stroke="#fff" stroke-width="3"/>` + lbl(X(ME.lng), Y(ME.lat) + 26, t("you"), "#1A73E8"); }
  $("#mapbox").innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="min-width:380px" role="img" aria-label="${esc(t("tMap"))}">${g}</svg>`; }

function drawChart() { const col = [css("--crit"), css("--plasma")], series = forecast().slice(0, 2), D = 14, W = 640, H = 220, L = 34, R = 14, T = 14, B = 26;

  const X = (d) => L + (d / D) * (W - L - R), Y = (v) => T + (1 - v / maxY) * (H - T - B); let g = "";

async function ask(q) { q = (q || "").trim(); if (!q || busy) return; const s = await getSample(); if (!s) return;
  BUB.push({ k: "me", t: q }); CHAT.push({ role: "user", content: q }); const bot = { k: "bot", t: t("thinking") }; BUB.push(bot); paintChat();
  busy = true; ctl = new AbortController(); tb(true);
  const head = `You are "Rafeeq", assistant of a SMART BLOOD BANK demo app in Egypt. Reply in the language of the user's latest message; if unclear use ${LANG_NAME[lang]}. Short and warm.
The user is ${{ beneficiary: "a patient's relative", donor: "a donor (type O-)", facility: "staff at " + fac("f1").en }[agentRole]}; location downtown Cairo.
Use tools for every fact; never invent numbers. No medical diagnosis. Emergencies: first advise calling an ambulance (123 in Egypt). Never reveal donor identities. Donation is voluntary and unpaid; never suggest buying blood.
Before create_blood_request, summarize and ask for confirmation. All data is demo data.`;
  const input = CHAT.map((m, i) => i === 0 ? { role: "user", content: head + "\n\nUser: " + m.content } : m);
  try { const { text } = await s(input, { tools: TOOLS(), modelTier: "quick", cache: false, signal: ctl.signal, onText: ({ text }) => { bot.t = text; BUB.splice(BUB.indexOf(bot), 1); BUB.push(bot); paintChat(); } });
    bot.t = text || "…"; CHAT.push({ role: "assistant", content: bot.t });
  } catch (e) { bot.t = e?.text || sampleErr(e); if (e?.text) CHAT.push({ role: "assistant", content: e.text }); else CHAT.pop(); }
  finally { busy = false; tb(false); paintChat(); } }

  on("#hz", "input", (e) => { FC.horizon = +e.value; $("#hzv").textContent = e.value; }); on("#hz", "change", () => render());
  on("#recall", "click", () => { const ty = forecast().filter((x) => x.risk !== "stable").map((x) => x.b); const n = DONORS.filter((d) => d.eligible && ty.includes(d.bt) && km(d, fac("f1")) <= 25).length; toast(f("recallDone", { n, t: ty.join(" ") }) + " " + t("simulated")); });
  on("#aiBtn", "click", () => aiGen(view === "forecast" ? "plan" : "report"));
  on("[data-mrole]", "click", (e) => { mapRole = e.dataset.mrole; render(); });
  on("[data-book]", "click", (e) => { const x = fac(e.dataset.book), d = new Date(Date.now() + 864e5); APPT = `${fname(x)} — ${dt(d, { weekday: "long", day: "numeric", month: "long" })} 11:00`;
    toast(f("booked", { name: fname(x), day: dt(d, { weekday: "long", day: "numeric", month: "long" }), hour: "11:00" })); render(); });
  on("[data-arole]", "click", (e) => { agentRole = e.dataset.arole; document.querySelectorAll("[data-arole]").forEach((x) => x.setAttribute("aria-pressed", String(x === e))); });
  on("[data-q]", "click", (e) => ask(e.dataset.q));
  on("#composer", "submit", (e, ev) => { ev.preventDefault(); const q = $("#q"); const v = q.value; q.value = ""; ask(v); });
  on("#stop", "click", () => ctl?.abort());
  on("[data-urole]", "click", (e) => { const [id, r] = e.dataset.urole.split(":"), u = USERS.find((x) => x.id === id); if (u.role === r) return; audit("set_role", fname(u), { role: [u.role, r] }); u.role = r; render(); });
  on("[data-usus]", "click", (e) => { const u = USERS.find((x) => x.id === e.dataset.usus); twoStep("u" + u.id, () => { audit("suspend_user", fname(u), { suspended: [u.suspended, !u.suspended] }); u.suspended = !u.suspended; render(); }); });
  on("[data-plan]", "click", (e) => { const [id, p] = e.dataset.plan.split(":"), x = fac(id); if (x.plan === p) return; audit("set_plan", fname(x), { plan: [x.plan, p] }); x.plan = p; render(); });
  on("[data-fver]", "click", (e) => { const x = fac(e.dataset.fver); audit("verify_facility", fname(x), { verified: [x.verified, !x.verified] }); x.verified = !x.verified; render(); });
  on("[data-fsus]", "click", (e) => { const x = fac(e.dataset.fsus); twoStep("f" + x.id, () => { audit("suspend_facility", fname(x), { suspended: [x.suspended, !x.suspended] }); x.suspended = !x.suspended; render(); }); });
  on("#cSave", "click", () => { const title = $("#cTitle").value.trim(), org = $("#cOrg").value.trim(), fee = Math.max(0, +$("#cFee").value || 0); if (!title || !org) return;
    const code = Math.random().toString(36).slice(2, 8).toUpperCase(); CAMPAIGNS.unshift({ id: "c" + seq++, title: { ar: title, en: title }, org, fac: "f2", code, start: Date.now() + 864e5, end: Date.now() + 8*864e5, target: 50, fee, signups: 0 });
    audit("create_campaign", title, { fee_egp: fee, code }); toast(code); render(); });
}
function join(code) { const c = CAMPAIGNS.find((x) => x.code === String(code || "").trim().toUpperCase() && x.end > Date.now()); if (!c) return toast(t("campaignNotFound")); if (!JOINED.has(c.id)) { JOINED.add(c.id); c.signups++; } toast(t("joined")); render(); }
$("#lang").addEventListener("change", (e) => { lang = e.target.value; try { localStorage.setItem("sbb.demo.lang", lang); } catch {} BUB.length = 0; CHAT.length = 0; report = null; render(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
new MutationObserver(() => { if (view === "forecast") drawChart(); if (view === "map") drawMap(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
render();
})();
</script>
