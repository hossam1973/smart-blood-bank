  for (let i = 0; i < 180; i++) DONORS.push({ bt: dist[Math.floor(r()*dist.length)], lat: 30.0444 + (r()-.5)*0.25, lng: 31.2357 + (r()-.5)*0.25, eligible: r() > .3 }); })();
const DONOR = { id: "u1", ar: "أحمد", en: "Ahmed", bt: "O-", sex: "male", last: "2026-07-10", available: true, board: true };
const USERS = [
  { id: "u1", ar: "أحمد (متبرع)", en: "Ahmed (donor)", role: "donor", phone: "+20 100 000 1001", suspended: false },
  { id: "u2", ar: "منى (مستفيدة)", en: "Mona (patient's family)", role: "beneficiary", phone: "+20 100 000 1002", suspended: false },

const km = (a, b) => { const R = 6371, r = Math.PI/180, dLa = (b.lat-a.lat)*r, dLn = (b.lng-a.lng)*r;

  on("#board", "change", (e) => { DONOR.board = e.checked; render(); });
  on("[data-respond]", "click", (e) => { const r = REQUESTS.find((x) => x.id === e.dataset.respond); RESPONSES.add(r.id); toast(f("thanksResponded", { name: fname(fac(r.fac)) })); render(); });
  on("[data-join]", "click", (e) => join(e.dataset.join)); on("#joinBtn", "click", () => join($("#code").value));
  on("[data-bt]", "click", (e) => { benBt = e.dataset.bt; benResults = null; render(); });
  on("#units", "change", (e) => benUnits = Math.max(1, Math.min(20, Math.round(+e.value) || 1)));
  on("#search", "click", () => { benResults = inventoryNear(benBt); render(); });
  on("[data-req]", "click", (e) => { REQUESTS.push({ id: "r" + seq++, fac: e.dataset.req, bt: benBt, units: benUnits, secured: 0, urgency: "urgent", verified: false, mine: true, at: Date.now() }); toast(f("requestSent", { name: fname(fac(e.dataset.req)) })); render(); });
  on("[data-mv]", "click", (e) => { const [b, d] = e.dataset.mv.split(":"); INV.f1[b] = Math.max(0, INV.f1[b] + +d); if (+d < 0) RATES[b].burn = r1(RATES[b].burn + 1/14); else RATES[b].inflow = r1(RATES[b].inflow + 1/14); render(); });
  on("[data-verify]", "click", (e) => { const r = REQUESTS.find((x) => x.id === e.dataset.verify); r.verified = true; audit("verify_request", r.id, { verified: [false, true] }); toast(f("verifiedMsg", { n: donorsFor(r).length }) + " " + t("simulated")); render(); });
  on("[data-fulfil]", "click", (e) => { const r = REQUESTS.find((x) => x.id === e.dataset.fulfil); if (INV.f1[r.bt] > 0) { INV.f1[r.bt]--; r.secured++; RATES[r.bt].burn = r1(RATES[r.bt].burn + 1/14); render(); } });
  on("#scanBtn", "click", () => { scanned = true; audit("qr_lookup", fname(DONOR), { facility: "f1" }); render(); }); on("#unscan", "click", () => { scanned = null; render(); });
  on("#record", "click", () => { const code = Math.random().toString(16).slice(2, 12).toUpperCase(); DONATIONS.unshift({ code, donor: "u1", bt: DONOR.bt, status: "collected", events: [{ s: "collected", at: Date.now() }] });
    DONOR.last = new Date().toISOString().slice(0, 10); scanned = null; toast(f("donationRecorded", { code })); render(); });
  on("[data-adv]", "click", (e) => { const d = DONATIONS.find((x) => x.code === e.dataset.adv), nx = STEPS[STEPS.indexOf(d.status) + 1]; if (!nx) return;
    if (nx === "ready") INV.f1[d.bt]++; if (nx === "issued") { INV.f1[d.bt] = Math.max(0, INV.f1[d.bt] - 1); const r = REQUESTS.find((x) => x.fac === "f1" && x.bt === d.bt && x.secured < x.units); if (r) r.secured++; }
    d.status = nx; d.events.push({ s: nx, at: Date.now() }); toast(t("j_" + nx)); render(); });
  on("[data-discard]", "click", (e) => { const d = DONATIONS.find((x) => x.code === e.dataset.discard); if (d.status === "ready") INV.f1[d.bt] = Math.max(0, INV.f1[d.bt] - 1); d.status = "discarded"; d.events.push({ s: "discarded", at: Date.now() }); render(); });
  on("[data-season]", "click", (e) => { FC.season = e.dataset.season; render(); }); on("[data-surge]", "click", (e) => { FC.surge = e.dataset.surge; render(); });
  on("#hz", "input", (e) => { FC.horizon = +e.value; $("#hzv").textContent = e.value; }); on("#hz", "change", () => render());
  on("#recall", "click", () => { const ty = forecast().filter((x) => x.risk !== "stable").map((x) => x.b); const n = DONORS.filter((d) => d.eligible && ty.includes(d.bt) && km(d, fac("f1")) <= 25).length; toast(f("recallDone", { n, t: ty.join(" ") }) + " " + t("simulated")); });
  on("#aiBtn", "click", () => aiGen(view === "forecast" ? "plan" : "report"));
  on("[data-mrole]", "click", (e) => { mapRole = e.dataset.mrole; render(); });
  on("[data-book]", "click", (e) => { const x = fac(e.dataset.book), d = new Date(Date.now() + 864e5); APPT = `${fname(x)} — ${dt(d, { weekday: "long", day: "numeric", month: "long" })} 11:00`;
    toast(f("booked", { name: fname(x), day: dt(d, { weekday: "long", day: "numeric", month: "long" }), hour: "11:00" })); render(); });
  on("[data-arole]", "click", (e) => { agentRole = e.dataset.arole; document.querySelectorAll("[data-arole]").forEach((x) => x.setAttribute("aria-pressed", String(x === e))); });
  on("[data-q]", "click", (e) => ask(e.dataset.q));
  on("#composer", "submit", (e, ev) => { ev.preventDefault(); const q = $("#q"); const v = q.value; q.value = ""; ask(v); });
  on("#stop", "click", () => ctl?.abort());
  on("[data-urole]", "click", (e) => { const [id, r] = e.dataset.urole.split(":"), u = USERS.find((x) => x.id === id); if (u.role === r) return; audit("set_role", fname(u), { role: [u.role, r] }); u.role = r; render(); });
  on("[data-usus]", "click", (e) => { const u = USERS.find((x) => x.id === e.dataset.usus); twoStep("u" + u.id, () => { audit("suspend_user", fname(u), { suspended: [u.suspended, !u.suspended] }); u.suspended = !u.suspended; render(); }); });
  on("[data-plan]", "click", (e) => { const [id, p] = e.dataset.plan.split(":"), x = fac(id); if (x.plan === p) return; audit("set_plan", fname(x), { plan: [x.plan, p] }); x.plan = p; render(); });
  on("[data-fver]", "click", (e) => { const x = fac(e.dataset.fver); audit("verify_facility", fname(x), { verified: [x.verified, !x.verified] }); x.verified = !x.verified; render(); });
  on("[data-fsus]", "click", (e) => { const x = fac(e.dataset.fsus); twoStep("f" + x.id, () => { audit("suspend_facility", fname(x), { suspended: [x.suspended, !x.suspended] }); x.suspended = !x.suspended; render(); }); });
  on("#cSave", "click", () => { const title = $("#cTitle").value.trim(), org = $("#cOrg").value.trim(), fee = Math.max(0, +$("#cFee").value || 0); if (!title || !org) return;
    const code = Math.random().toString(36).slice(2, 8).toUpperCase(); CAMPAIGNS.unshift({ id: "c" + seq++, title: { ar: title, en: title }, org, fac: "f2", code, start: Date.now() + 864e5, end: Date.now() + 8*864e5, target: 50, fee, signups: 0 });
    audit("create_campaign", title, { fee_egp: fee, code }); toast(code); render(); });
}
function join(code) { const c = CAMPAIGNS.find((x) => x.code === String(code || "").trim().toUpperCase() && x.end > Date.now()); if (!c) return toast(t("campaignNotFound")); if (!JOINED.has(c.id)) { JOINED.add(c.id); c.signups++; } toast(t("joined")); render(); }
$("#lang").addEventListener("change", (e) => { lang = e.target.value; try { localStorage.setItem("sbb.demo.lang", lang); } catch {} BUB.length = 0; CHAT.length = 0; report = null; render(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());
new MutationObserver(() => { if (view === "forecast") drawChart(); if (view === "map") drawMap(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
render();
})();
</script>
